name: Rehearse release failure and recovery

on:
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Fail the first attempt with deliberately mismatched expected bytes, then use Re-run failed jobs to recover
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reviewed-archive:
    name: Preserve the existing published archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download the unchanged 0.1.1 release archive
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {mkdir, writeFile} from 'node:fs/promises';
          const response = await fetch('https://github.com/Lingikaushikreddy/release-lens/releases/download/v0.1.1/releaselens-0.1.1.tgz', {signal: AbortSignal.timeout(60_000)});
          assert.equal(response.status, 200);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha256').update(bytes).digest('hex'), '1caf85d79f2c3f6528e5563a962d0fac30686b7ec7ad3001f19283704f63f5e8');
          await mkdir('reviewed', {recursive:true});
          await writeFile('reviewed/releaselens-0.1.1.tgz', bytes);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-reviewed-archive
          retention-days: 30
          path: reviewed/releaselens-0.1.1.tgz
          if-no-files-found: error

  verify:
    name: Reject mismatched bytes or verify the recovered archive
    needs: reviewed-archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_LENS_REGISTRY_PACKAGE: '@kaushikgojo/release-lens'
      RELEASE_LENS_REGISTRY_VERSION: '0.1.1'
      RELEASE_LENS_REGISTRY_ARTIFACT: work/recovery/releaselens-0.1.1.tgz
      RELEASE_LENS_REGISTRY_REPORT: work/recovery/registry-recovery.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovery-reviewed-archive
          path: work/recovery
      - name: Deliberately corrupt only the local expectation on the first attempt
        if: inputs.inject_failure && github.run_attempt == 1
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path = process.env.RELEASE_LENS_REGISTRY_ARTIFACT;
          const bytes = await readFile(path);
          bytes[bytes.length - 1] ^= 1;
          await writeFile(path, bytes);
          console.log('Injected a local expected-artifact mismatch. The registry integrity gate must fail before installation.');
          NODE
      - name: Run the real anonymous registry verification
        run: node scripts/test-registry.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-receipt-attempt-${{ github.run_attempt }}
          retention-days: 30
          path: work/recovery/registry-recovery.json
          if-no-files-found: ignore
