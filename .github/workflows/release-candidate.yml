name: Build reviewable release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:pack
      - run: node scripts/verify-effects.mjs
      - run: pnpm test:oracle
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Pack candidate without lifecycle scripts
        run: |
          mkdir -p candidate
          npm pack ./packages/cli --ignore-scripts --pack-destination candidate
          cp -R dist candidate/site
          cp -R evidence candidate/evidence
          cp README.md LICENSE THIRD_PARTY_NOTICES.md docs/measurement-contract.md candidate/
          cd candidate
          sha256sum releaselens-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-lens-candidate-${{ github.sha }}
          retention-days: 7
          path: candidate/
          if-no-files-found: error
