name: Build reviewable release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:pack
        env:
          RELEASE_LENS_PACK_DESTINATION: work/release-cli.tgz
      - run: node scripts/verify-effects.mjs
      - run: pnpm test:oracle
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Assemble candidate from the tested CLI tarball
        run: python3 scripts/package-candidate.py --cli-artifact work/release-cli.tgz --output work/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-lens-candidate-${{ github.sha }}
          retention-days: 7
          path: |
            work/candidate/*.tgz
            work/candidate/*-source.tar.gz
            work/candidate/*-web.zip
            work/candidate/evidence/
            work/candidate/SHA256SUMS
            work/candidate/release.json
          if-no-files-found: error
