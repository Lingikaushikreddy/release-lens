name: Verify published npm 0.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  registry:
    name: Registry Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RELEASE_LENS_REGISTRY_PACKAGE: '@kaushikgojo/release-lens'
      RELEASE_LENS_REGISTRY_VERSION: '0.1.0'
      RELEASE_LENS_REGISTRY_ARTIFACT: work/released-0.1.0.tgz
      RELEASE_LENS_REGISTRY_REPORT: evidence/npm/registry-node${{ matrix.node }}-${{ matrix.os }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Download and verify the reviewed release artifact
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { dirname } from 'node:path';

          const url = 'https://github.com/Lingikaushikreddy/release-lens/releases/download/v0.1.0/kaushikgojo-release-lens-0.1.0.tgz';
          const expected = 'f4cf049a1b4a7255a56e762d5775cd57776b52ed1b3c6813e1a7f5b19d6bddd2';
          const response = await fetch(url, { signal: AbortSignal.timeout(60_000) });
          assert.equal(response.status, 200, 'Reviewed GitHub release artifact must be publicly available');
          const bytes = Buffer.from(await response.arrayBuffer());
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          assert.equal(sha256, expected, 'GitHub release artifact must match the pinned reviewed SHA-256');
          const destination = process.env.RELEASE_LENS_REGISTRY_ARTIFACT;
          await mkdir(dirname(destination), { recursive: true });
          await writeFile(destination, bytes);
          console.log(`Reviewed release artifact verified: ${bytes.length} bytes; SHA-256 ${sha256}`);
          NODE
      - name: Verify real registry npx and clean installation
        run: node scripts/test-registry.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: registry-node${{ matrix.node }}-${{ matrix.os }}
          retention-days: 7
          path: ${{ env.RELEASE_LENS_REGISTRY_REPORT }}
          if-no-files-found: warn
